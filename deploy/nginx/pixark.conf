# 宝塔 Nginx 站点配置模板
# 用法：宝塔【网站】→【添加站点】（域名先填服务器 IP，备案后再改）
#      → 站点【设置】→【配置文件】，把里面 server{} 的内容整体替换成本文件
# 本文件不放进 docker-compose，Nginx 跑在宿主机上

server {
    listen 80;
    server_name _;                      # 备案下来后改成 pixark.你的域名

    root /www/wwwroot/pixark;           # 前端 dist 里的文件传到这个目录
    index index.html;

    # 后端 multipart 上限是 5MB，Nginx 默认只放行 1MB 请求体。
    # 不写这行，稍大的图上传会先被 Nginx 用 413 挡掉，而后端日志里一片干净
    client_max_body_size 6m;

    # 必须写在资源缓存规则之前：^~ 让 /api/ 下的请求不再去匹配下面的正则，
    # 否则万一某个接口路径带扩展名就会被当静态文件处理
    location ^~ /api/ {
        # 结尾不能带斜杠：带了会把 /api 前缀剥掉，而后端 context-path 就是 /api
        proxy_pass http://127.0.0.1:8123;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 图片编辑和以图搜图都是"提交后轮询"，默认 60s 会把慢请求掐断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Vue Router history 模式：刷新子路由时回落到 index.html，否则 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可以放心长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # 但 index.html 不能缓存，否则前端发新版后用户拿到的还是旧入口、白屏
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    access_log /www/wwwlogs/pixark.log;
    error_log /www/wwwlogs/pixark.error.log;
}
